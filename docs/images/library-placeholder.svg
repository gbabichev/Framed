<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Frame Library screenshot placeholder</title>
  <desc id="desc">A square placeholder for a future Framed app screenshot.</desc>
  <style>
    :root { --bg: #edf2fa; --line: #becbe0; --muted: #596376; --ink: #151b2b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d2b42; --line: #435572; --muted: #b0b9cb; --ink: #f1f4fc; }
    }
  </style>
  <rect width="800" height="800" rx="24" fill="var(--bg)"/>
  <rect x="40" y="40" width="720" height="720" rx="16" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="10 10"/>
  <g fill="var(--muted)" font-family="-apple-system, Helvetica Neue, sans-serif" text-anchor="middle">
    <text x="400" y="338" font-size="18" letter-spacing="3">SCREENSHOT 02</text>
    <text x="400" y="398" font-size="36" font-weight="600" fill="var(--ink)">Frame Library</text>
    <text x="400" y="446" font-size="21">Your screenshot here</text>
  </g>
</svg>
